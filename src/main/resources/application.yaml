spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/weconnect_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Dùng Flyway để quản lý schema, không dùng update của Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

app:
  security:
    jwt:
      secret: ${JWT_SECRET:VGhpc0RldmVsb3BtZW50U2VjcmV0S2V5Rm9yV2VDb25uZWN0}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000}
    frontend-url: ${FRONTEND_URL:http://localhost:8080}
